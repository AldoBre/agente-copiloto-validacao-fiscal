<!--
  Favicon na marca Sancon: quadrado navy (estrutural) com o "S" em lime.
  Lime aqui é acento sobre navy, não CTA — e o contraste passa em tamanho de aba.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0D4270"/>
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="Hanken Grotesk, Segoe UI, system-ui, sans-serif"
        font-size="40" font-weight="700" fill="#ABD821">S</text>
</svg>
